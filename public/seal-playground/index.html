<!DOCTYPE html><html lang="zh-CN"><head><base href="/seal-playground/"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#98d9f7"><title>团团游乐场</title><link rel="icon" href="data:,"><link rel="stylesheet" href="./styles.css"></head><body data-mode="home">
<main id="shell" aria-label="小海豹互动游戏"><div id="canvas-host"></div>
<nav id="menu" aria-label="游戏菜单">
  <div class="menu-group">
    <button id="care" class="category" aria-expanded="false" aria-controls="care-options">
      <img src="./assets/icon-avatar.png" alt="">喂养<span class="caret"></span>
    </button>
    <div class="menu-options" id="care-options" hidden>
      <button id="feed"><svg viewBox="0 0 64 52" aria-hidden="true"><path d="M44 23Q53 19 59 13Q62 20 57 26Q62 34 58 39L44 31Q22 48 6 28Q8 12 26 12Q32 4 39 9L39 16Z" fill="#8ed3cb" stroke="#405568" stroke-width="3" stroke-linejoin="round"/><circle cx="17" cy="24" r="2.8" fill="#35495c"/></svg>吃饭</button>
    </div>
  </div>
  <div class="menu-group">
    <button id="learn" class="category" aria-expanded="false" aria-controls="learn-options">
      <img src="./assets/icon-draw.png" alt="">学习<span class="caret"></span>
    </button>
    <div class="menu-options" id="learn-options" hidden>
      <button id="draw"><img src="./assets/icon-draw.png" alt="">画画</button>
      <button id="puzzle"><img src="./assets/icon-puzzle.png" alt="">拼图</button>
      <button id="music"><img src="./assets/icon-music.png" alt="">唱歌</button>
    </div>
  </div>
</nav>
<div id="utilities" hidden><button id="music-play" class="util" aria-label="播放或停止旋律" hidden><svg viewBox="0 0 100 100"><path d="M38 22 76 50 38 78Z"/></svg></button><button id="replay" class="util" aria-label="再玩一次"><svg viewBox="0 0 100 100"><path d="M23 42A30 30 0 1 1 25 68M23 19V43H47"/></svg></button><button id="home" class="util" aria-label="回到首页"><svg viewBox="0 0 100 100"><path d="M16 44 50 15 84 44M25 40V84H75V40M43 84V60H57V84"/></svg></button></div>
<div id="draw-tools" hidden></div><div id="loading" aria-label="正在打开游戏"><span class="dot"></span></div><div id="error" hidden><strong>暂时无法打开互动</strong><span id="error-detail"></span><button onclick="location.reload()">重新打开</button></div>
<aside id="tuning" hidden><label for="strength">回弹幅度（Shift + D 显示或隐藏）</label><input id="strength" type="range" min="0.12" max="0.42" step="0.01" value="0.34"></aside>
</main><div id="rotate" aria-label="请横过来玩"><svg viewBox="0 0 180 180"><rect x="33" y="58" width="114" height="66" rx="12" fill="#ffffff77"/><path d="M135 36A62 62 0 0 0 37 39M36 17V40H59M45 146A62 62 0 0 0 143 143M144 165V142H121"/><path d="M131 82V100"/></svg></div>

<script src="./vendor/pixi.js"></script>
<script src="./shared/canvas-fallback.js"></script>
<script type="module" src="./app.js"></script>
</body></html>
